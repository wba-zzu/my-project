__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetr_r18vd.yml',
]


# ============================================================
# Output
# ============================================================

output_dir: ../output/train/original/rtdetr_r18vd_visdrone


# ============================================================
# RT-DETR R18
# ============================================================

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: /home/ubuntu/WBA/RT-DETR-WBA/pretrained/ResNet18_vd_pretrained_from_paddle.pth


# ============================================================
# Efficient Hybrid Encoder
# ============================================================

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


# ============================================================
# Decoder
# ============================================================

RTDETRTransformer:
  eval_idx: -1
  num_decoder_layers: 3
  num_denoising: 100


# ============================================================
# Optimizer
# ============================================================

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00001
      weight_decay: 0.

    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001

    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

